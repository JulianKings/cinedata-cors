<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineData - Estadísticas</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <h1>🎬 CineData</h1>

    <nav class="nav">
      <a href="index.html">Películas</a>
      <a href="estadisticas.html">Estadísticas</a>
    </nav>
  </header>

  <main class="panel">
    <form id="form-estadisticas" class="filtros">
      <input type="number" name="minimo" placeholder="Mínimo de películas" min="1" max="50" step="1">
      <button type="submit">Filtrar</button>
    </form>

    <p id="estado" class="estado"></p>

    <div class="tabla-contenedor">
      <table class="tabla">
        <thead>
          <tr>
            <th>Género</th>
            <th>Películas</th>
            <th>Nota media</th>
          </tr>
        </thead>
        <tbody id="cuerpo-estadisticas"></tbody>
      </table>
    </div>
  </main>

  <script type="module" src="js/estadisticas.js"></script>
</body>
</html>
